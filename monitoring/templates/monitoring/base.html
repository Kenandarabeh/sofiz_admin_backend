<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SofizAdmin | Real-Time Financial Monitoring & Audit{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #07090E;
            --bg-surface: #0E131F;
            --bg-card: rgba(16, 23, 38, 0.75);
            --bg-card-hover: rgba(24, 34, 56, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(59, 130, 246, 0.35);
            --primary: #3B82F6;
            --primary-gradient: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
            --stellar-gold: #FBBF24;
            --stellar-gradient: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            --g2bulk-cyan: #06B6D4;
            --g2bulk-gradient: linear-gradient(135deg, #06B6D4 0%, #0284C7 100%);
            --success: #10B981;
            --success-glow: rgba(16, 185, 129, 0.25);
            --danger: #EF4444;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --warning: #F59E0B;
            --text-main: #F9FAFB;
            --text-muted: #94A3B8;
            --text-dim: #64748B;
            --radius-btn: 8px;
            --radius-card: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; height: 100vh;
            background: radial-gradient(circle at 20% 15%, rgba(59, 130, 246, 0.07) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        header {
            background: rgba(11, 16, 28, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .brand-badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93C5FD;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }
        nav { display: flex; align-items: center; gap: 8px; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: var(--radius-btn);
            font-weight: 600;
            font-size: 13.5px;
            transition: all 0.2s ease;
        }
        nav a:hover, nav a.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .main-container { max-width: 1440px; width: 100%; margin: 28px auto; padding: 0 24px; flex: 1; }
        
        .btn {
            padding: 9px 18px;
            border-radius: var(--radius-btn);
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        footer {
            border-top: 1px solid var(--border-glass);
            padding: 20px 32px;
            text-align: center;
            font-size: 13px;
            color: var(--text-dim);
            background: rgba(11, 16, 28, 0.5);
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 24px;">
            <a href="/" class="brand">
                <div class="brand-icon">💎</div>
                <span>SofizAdmin</span>
                <span class="brand-badge">Financial Monitor</span>
            </a>
            <nav>
                <a href="/admin/monitoring/gamingfinancialstatus/">🎮 Gaming Audit</a>
                <a href="/admin/monitoring/utilityfinancialstatus/">⚡ Factures Audit</a>
                <a href="/admin/">⚙️ Admin Panel</a>
            </nav>
        </div>

        <div class="header-actions">
            <button id="btnSyncGlobal" class="btn btn-primary" onclick="triggerGlobalSync()">
                <span id="syncSpinner" style="display: inline-block;">⚡</span>
                <span>Sync & Audit</span>
            </button>
            <a href="/admin/" class="btn btn-outline">⚙️ Django Admin</a>
        </div>
    </header>

    <div class="main-container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        Real-Time Financial Monitoring System &copy; SofizPay 2026 - All Rights Reserved
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
